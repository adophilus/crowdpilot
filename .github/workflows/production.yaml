name: production

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Build-time VITE inline (public value — the browser bundle needs it).
  VITE_API_URL: https://api.crowdpilot.hackathons.adophilus.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment information
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project artifacts
        working-directory: apps/web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel

      - name: Deploy project artifacts to Vercel
        working-directory: apps/web
        run: |
          DEPLOY_DIR="$(mktemp -d)"
          mkdir -p "$DEPLOY_DIR/.vercel"
          cp -R .vercel/output "$DEPLOY_DIR/.vercel/output"
          cp .vercel/project.json "$DEPLOY_DIR/.vercel/project.json"
          cp vercel.json "$DEPLOY_DIR/vercel.json"
          # Deploy from outside the git checkout: keeps deploys working on
          # plans that block unverified committers, and keeps the git
          # integration off (vercel.json git.deploymentEnabled=false).
          cd "$DEPLOY_DIR"
          vercel deploy --prebuilt --prod --public --token=${{ secrets.VERCEL_TOKEN }}
